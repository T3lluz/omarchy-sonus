name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Manifest is valid
        run: python3 -c "import json; m = json.load(open('manifest.json')); assert m['id'] and m['version'] and m['entryPoints']"
      - name: EQ model tests
        run: node tests/eq.test.js
      - name: Audio helpers
        run: node tests/audio.test.js
      - name: Rooms model and pixel icons
        run: node tests/model.test.js
      - name: Shortcut bind block
        run: node tests/shortcut.test.js
      - name: Icon motion
        run: node tests/motion.test.js
      - name: README badge matches the manifest
        run: |
          python3 - <<'PY'
          import json, re
          version = json.load(open("manifest.json"))["version"]
          badge = re.search(r"badge/v([0-9.]+)-", open("README.md").read())
          assert badge and badge.group(1) == version, f"README badge {badge and badge.group(1)} != manifest {version}"
          PY
      - name: Engine tests
        run: python3 -B -m unittest discover tests
